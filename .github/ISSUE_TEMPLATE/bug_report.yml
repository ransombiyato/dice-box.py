name: Bug report
description: Something isn't working as expected.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this!
  - type: input
    id: versions
    attributes:
      label: Versions (Minecraft / NeoForge / mod / Java)
      placeholder: "MC 1.21.1, NeoForge 21.1.176, dicebox 0.1.0, Java 21.0.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04 / Windows 11 / macOS 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / crash report excerpts
      description: Paste the relevant part of latest.log or a crash report. Remove anything private first.
      render: text
    validations:
      required: false
