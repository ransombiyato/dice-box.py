name: Feature request
description: Suggest an idea for the project.
title: "[feat] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: DiceBox Computers is built phase-by-phase from docs/MASTER_SPEC.md — check docs/ROADMAP.md for what's already planned before requesting.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
