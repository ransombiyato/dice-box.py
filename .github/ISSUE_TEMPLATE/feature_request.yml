name: Feature request
description: Suggest an idea for the project.
title: "[feat] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: This project is a fresh start — what should it become?
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
