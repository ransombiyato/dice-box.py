name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      # Build failures are surfaced as check-run annotations so they can be
      # read from the API without downloading runner logs.
      - name: Compile core engine
        run: |
          set +e
          gradle --no-daemon compileJava 2>&1 | tee /tmp/compile.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:|What went wrong|Caused by|Could not (resolve|find|create)|FAILURE|Unsupported|requires|No matching" /tmp/compile.log \
              | head -40 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::error::compileJava exited with ${status}"
            exit "$status"
          fi

      - name: Run unit tests
        run: |
          set +e
          gradle --no-daemon test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:|FAILED|What went wrong|Caused by|FAILURE|tests? failed" /tmp/test.log \
              | head -40 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::error::test exited with ${status}"
            exit "$status"
          fi

      - name: Build mod jar
        run: |
          set +e
          gradle --no-daemon build -x test 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:|What went wrong|Caused by|FAILURE" /tmp/build.log \
              | head -40 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::error::build exited with ${status}"
            exit "$status"
          fi

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minetech-jar
          path: build/libs/*.jar
          if-no-files-found: warn
