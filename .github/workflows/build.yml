name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.0"

      # A build failure is collapsed into one annotation carrying the whole
      # "What went wrong" block, because runner logs redirect to a host that
      # is not reachable from the dev sandbox, while annotations are.
      - name: Compile core engine
        run: |
          set +e
          gradle --no-daemon compileJava 2>&1 | tee /tmp/compile.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(awk '/What went wrong/{f=1} f' /tmp/compile.log | head -25 | tr '\n' '|' | cut -c1-1500)
            echo "::error::compileJava failed: ${detail}"
            exit "$status"
          fi

      - name: Run unit tests
        run: |
          set +e
          gradle --no-daemon test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(awk '/What went wrong/{f=1} f' /tmp/test.log | head -25 | tr '\n' '|' | cut -c1-1500)
            fails=$(grep -E "FAILED" /tmp/test.log | head -5 | tr '\n' '|')
            echo "::error::tests failed: ${fails} ${detail}"
            exit "$status"
          fi

      - name: Build mod jar
        run: |
          set +e
          gradle --no-daemon build -x test 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(awk '/What went wrong/{f=1} f' /tmp/build.log | head -25 | tr '\n' '|' | cut -c1-1500)
            echo "::error::build failed: ${detail}"
            exit "$status"
          fi

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: minetech-jar
          path: build/libs/*.jar
          if-no-files-found: warn
