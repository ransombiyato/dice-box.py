name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Only used to post build-failure excerpts as PR comments (see below).
  pull-requests: write

jobs:
  build:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod and run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      # Some contributors/agents can use the GitHub API but cannot download
      # raw run logs, and check annotations are capped per step (a log tail
      # there truncates to useless stack frames). So on failure, publish a
      # filtered log excerpt two ways: the job summary (web UI) and a PR
      # comment (API-readable). Filtered for task/failure/compile/test
      # lines with context, never the whole log.
      - name: Surface build failure excerpt
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log="$RUNNER_TEMP/gradle-build.log"
          excerpt="$RUNNER_TEMP/failure-excerpt.txt"
          if [ -f "$log" ]; then
            grep -nE -B1 -A4 \
              "FAILED|FAILURE:|What went wrong|Execution failed|error:|symbol:|location:|AssertionFailedError|expected:|> Task " \
              "$log" | head -n 300 > "$excerpt" || true
            if [ ! -s "$excerpt" ]; then
              tail -n 100 "$log" > "$excerpt"
            fi
          else
            echo "No Gradle log was captured." > "$excerpt"
          fi
          {
            echo "## Gradle build failure excerpt"
            echo ""
            echo '```text'
            cat "$excerpt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "### CI build failure excerpt"
              echo ""
              echo "<details><summary>Filtered Gradle log (tasks, failures, compiler/test errors)</summary>"
              echo ""
              echo '```text'
              cat "$excerpt"
              echo '```'
              echo ""
              echo "</details>"
            } > "$RUNNER_TEMP/failure-comment.md"
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file "$RUNNER_TEMP/failure-comment.md"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

      - name: Upload built mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dicebox-jar
          path: build/libs/*.jar
          if-no-files-found: ignore

  tools:
    name: Python dev tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ascii_screen tests
        run: python3 tools/test_ascii_screen.py -v
