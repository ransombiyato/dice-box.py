name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod and run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      # Some contributors/agents can read check annotations via the GitHub API
      # but cannot download raw run logs. On failure, re-publish the tail of
      # the Gradle log as annotations so the failure is never a black box.
      - name: Surface build failure (log tail as annotations)
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/gradle-build.log"
          if [ -f "$log" ]; then
            tail -n 45 "$log" | while IFS= read -r line || [ -n "$line" ]; do
              esc=${line//%/%25}
              esc=${esc//$'\r'/%0D}
              [ -z "$esc" ] && esc="(blank line)"
              echo "::error title=gradle-build-log::${esc:0:600}"
            done
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

      - name: Upload built mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dicebox-jar
          path: build/libs/*.jar
          if-no-files-found: ignore

  tools:
    name: Python dev tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ascii_screen tests
        run: python3 tools/test_ascii_screen.py -v
